<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Anahat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .animate-shimmer {
            animation: shimmer 6s linear infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }

        /* ANAHAT — sunset peach primary action style (mirrors src/index.css) */
        .btn-sunset {
            background: linear-gradient(90deg, #F3A46B 0%, #F6C6B8 100%);
            color: #3B2415;
            box-shadow: 0 8px 24px -8px rgba(243, 164, 107, 0.55);
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        }
        .btn-sunset:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 30px -6px rgba(243, 164, 107, 0.65);
            filter: brightness(1.03);
        }
        .btn-sunset:active:not(:disabled) { transform: translateY(0) scale(0.99); }
        .btn-sunset:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .text-sunset { color: #D9773B; }
        .bg-sunset-soft { background: linear-gradient(135deg, rgba(243, 164, 107, 0.14), rgba(246, 198, 184, 0.14)); }
        .border-sunset { border-color: rgba(243, 164, 107, 0.35); }
    </style>
</head>
<body class="bg-[#FDF6EE] text-slate-900 font-sans min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-amber-500/30">
    <!-- Background Effects -->
    <div class="fixed inset-0 opacity-[0.04] pointer-events-none z-0 mix-blend-overlay"
         style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.65\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\' opacity=\'1\'/%3E%3C/svg%3E')">
    </div>

    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-amber-200/40 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-100/50 blur-[120px] pointer-events-none z-0"></div>

    <div id="cursor-glow" class="fixed w-[600px] h-[600px] rounded-full bg-[radial-gradient(circle_at_center,rgba(243,164,107,0.12),transparent_70%)] pointer-events-none transition-transform duration-[400ms] ease-out z-0"></div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md mx-4">
        <div class="bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-amber-500/10 border border-black/10 p-8 md:p-12">

            <!-- Logo -->
            <div class="flex items-center justify-center gap-3 group mb-8">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <img src="/assets/anahat-logo.png" alt="Anahat" class="w-10 h-10 object-contain relative z-10" />
                </div>
                <span class="font-serif font-bold text-2xl tracking-wide text-slate-900">Anahat Transformations</span>
            </div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-sunset bg-sunset-soft backdrop-blur-sm mb-4">
                    <svg class="w-4 h-4 text-sunset" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <span class="text-[11px] font-bold uppercase tracking-widest text-sunset">Secure Access</span>
                </div>
                <h1 class="text-4xl font-serif font-bold text-slate-900 mb-2">Admin Portal</h1>
                <p class="text-slate-600 font-light">Enter your credentials to continue</p>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/30 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm backdrop-blur-sm"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-2 ml-1">Admin Email</label>
                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full px-5 py-3.5 bg-black/[0.03] border border-black/10 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sunset focus:bg-white transition-all"
                        placeholder="admin@anahattransformations.com"
                    />
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-2 ml-1">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        class="w-full px-5 py-3.5 bg-black/[0.03] border border-black/10 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sunset focus:bg-white transition-all"
                        placeholder="••••••••"
                    />
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="btn-sunset w-full py-3.5 rounded-2xl font-bold uppercase tracking-widest text-sm"
                >
                    Access Portal
                </button>
            </form>

            <!-- Footer Link -->
            <div class="mt-8 text-center border-t border-black/5 pt-6">
                <a href="/" class="text-slate-500 hover:text-sunset text-sm transition-colors inline-flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Main Site
                </a>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:3000";

        // Mouse tracking for glow effect
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            requestAnimationFrame(() => {
                glow.style.transform = `translate(${e.clientX - 300}px, ${e.clientY - 300}px)`;
            });
        });

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Authenticating...';

            try {
                const response = await fetch(`${BACKEND_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication failed');
                }

                // Store token
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUser', JSON.stringify(data.admin));

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = '/admin-dashboard.html';
                }, 100);

            } catch (error) {
                errorDiv.innerHTML = `
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>${error.message}</span>
                    </div>
                `;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Access Portal';
            }
        });
    </script>
</body>
</html>
